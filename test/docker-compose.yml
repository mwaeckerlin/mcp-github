# End-to-end stack: test-client → mcp-github → fake-github. Both networks are
# internal, so no container of this stack reaches the internet: every GitHub
# call of mcp-github ends at the simulation, and a test can never touch the
# real GitHub or need a real token.
services:
  fake-github:
    build:
      context: ..
      dockerfile: test/fake-github/Dockerfile
    networks:
      - mcp-github-upstream
    environment:
      SIMULATED_GITHUB_TOKEN: simulated-github-token-for-the-test-stack-only
    healthcheck:
      test: ["CMD", "/usr/bin/node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  mcp-github:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mwaeckerlin/mcp-github
    # SECURITY: the GITHUB_TOKEN exists only in this container. The test-client
    # shares the MCP network with it and has no route to fake-github.
    networks:
      - mcp-github-test-client
      - mcp-github-upstream
    environment:
      GITHUB_TOKEN: simulated-github-token-for-the-test-stack-only
      GITHUB_API_URL: http://fake-github:8080
      MCP_GITHUB_HOST: 0.0.0.0
      MCP_GITHUB_PORT: 4000
    depends_on:
      fake-github:
        condition: service_healthy
    # no healthcheck here: the test-client waits for the HEALTHCHECK of the image

  test-client:
    build:
      context: ..
      dockerfile: test/Dockerfile
    networks:
      - mcp-github-test-client
    environment:
      MCP_GITHUB_URL: http://mcp-github:4000
    depends_on:
      mcp-github:
        condition: service_healthy

networks:
  # MCP traffic between test-client and mcp-github only
  mcp-github-test-client:
    internal: true
  # GitHub API traffic between mcp-github and the simulation only
  mcp-github-upstream:
    internal: true
